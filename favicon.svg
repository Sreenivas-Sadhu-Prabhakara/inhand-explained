<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="inhand explained">
  <rect width="32" height="32" rx="7" fill="#171C21"/>
  <!-- salary waterfall: three steel steps down to a tangerine in-hand bar -->
  <rect x="6"  y="9"  width="4" height="17" rx="1" fill="#8FA3B0"/>
  <rect x="12" y="13" width="4" height="13" rx="1" fill="#8FA3B0"/>
  <rect x="18" y="17" width="4" height="9"  rx="1" fill="#8FA3B0"/>
  <rect x="24" y="20" width="4" height="6"  rx="1" fill="#FF8A3D"/>
  <!-- dashed step-line connector: the explainer 'motion' cue -->
  <path d="M8 9 L14 13 L20 17 L26 20" fill="none" stroke="#8FA3B0" stroke-width="0.9"
        stroke-linecap="round" stroke-dasharray="1.4 1.6" opacity="0.6"/>
</svg>
